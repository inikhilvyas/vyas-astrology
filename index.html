<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>VYAS ASTRA • वैदिक ज्योतिष अनुसंधान एवं फलित विज्ञान</title>
    <meta name="description" content="Vedic Yield Astrology Systems (VYAS) - High-Precision Astronomical Intelligence, Kundli, Dasha, Gochar & BTR by Nikhil Vyas">
    <meta name="theme-color" content="#0b1220">
    
    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VYAS ASTRA">

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vyasbilawas-ctrl/vyas-astrology/master/logo_icon.png">

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="VYAS ASTRA • वैदिक ज्योतिष अनुसंधान">
    <meta property="og:description" content="उच्च-सटीक खगोलीय गणना, कुण्डली, चालू दशा, तात्कालिक गोचर एवं संपूर्ण वैदिक फलित विश्लेषण">
    <meta property="og:image" content="https://raw.githubusercontent.com/vyasbilawas-ctrl/vyas-astrology/master/logo_icon.png">
    <meta property="og:url" content="https://vyasastro.in">
    <meta property="og:type" content="website">

    <!-- Official Google Identity Services SDK (100% In-Page Verification, Zero Redirects) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0b1220;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #frame-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        #app-frame {
            width: 100%;
            height: calc(100% + 46px);
            height: calc(100dvh + 46px);
            border: none;
            display: block;
            background-color: #0b1220;
        }

        /* Luxury Animated Vedic Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111a33 0%, #060913 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .logo-orbit-container {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .celestial-ring {
            position: absolute;
            width: 126px;
            height: 126px;
            border-radius: 50%;
            border: 2px dashed rgba(240, 192, 90, 0.4);
            border-top-color: #f0c05a;
            border-bottom-color: #f0c05a;
            animation: orbitSpin 8s linear infinite;
        }
        .celestial-ring-outer {
            position: absolute;
            width: 142px;
            height: 142px;
            border-radius: 50%;
            border: 1px solid rgba(240, 192, 90, 0.18);
            border-left-color: rgba(240, 192, 90, 0.6);
            animation: orbitSpinReverse 12s linear infinite;
        }
        .animated-logo {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(240, 192, 90, 0.45), 0 8px 24px rgba(0, 0, 0, 0.8);
            animation: logoPulse 2.4s ease-in-out infinite;
            z-index: 2;
            object-fit: cover;
        }
        @keyframes orbitSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes orbitSpinReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes logoPulse {
            0% {
                transform: scale(0.96);
                box-shadow: 0 0 24px rgba(240, 192, 90, 0.35), 0 6px 18px rgba(0, 0, 0, 0.8);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 45px rgba(240, 192, 90, 0.65), 0 10px 28px rgba(0, 0, 0, 0.9);
            }
            100% {
                transform: scale(0.96);
                box-shadow: 0 0 24px rgba(240, 192, 90, 0.35), 0 6px 18px rgba(0, 0, 0, 0.8);
            }
        }
        .brand-title {
            color: #f0c05a;
            font-size: 1.55rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-top: 24px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffd97d 0%, #f0c05a 50%, #d49c28 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 18px rgba(240, 192, 90, 0.25);
        }
        .brand-tagline {
            color: #93c5fd;
            font-size: 0.84rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .brand-sub {
            color: #94a3b8;
            font-size: 0.80rem;
            margin-top: 6px;
        }
        .loading-bar-wrap {
            width: 140px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            margin-top: 18px;
            overflow: hidden;
            position: relative;
        }
        .loading-bar-fill {
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #f0c05a, transparent);
            position: absolute;
            animation: shimmerBar 1.5s infinite;
        }
        @keyframes shimmerBar {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        /* Luxury Floating PWA Install Button (Anchored Bottom-Left to avoid Chatbot Avatar) */
        #pwa-install-btn {
            position: fixed;
            bottom: 24px;
            left: 20px;
            right: auto;
            z-index: 9995;
            background: linear-gradient(135deg, #1e293b 0%, #0b1220 100%);
            color: #f0c05a;
            border: 1.8px solid #f0c05a;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }
        #pwa-install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(240, 192, 90, 0.35);
            background: linear-gradient(135deg, #2d3b55 0%, #0f172a 100%);
        }
        #ios-modal {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1.5px solid #f0c05a;
            color: #f8fafc;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 0.85rem;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 90%;
        }
        /* Floating Refresh Button for PWA & Mobile (Anchored Bottom-Left above Install Button) */
        #pwa-refresh-btn {
            position: fixed;
            bottom: 74px;
            left: 20px;
            right: auto;
            z-index: 9990;
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
            color: #0b1220;
            border: 2px solid #fef3c7;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 0.86rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.45);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        @media (max-width: 600px) {
            #pwa-install-btn {
                bottom: 16px;
                left: 14px;
                padding: 7px 12px;
                font-size: 0.78rem;
            }
            #pwa-refresh-btn {
                bottom: 58px;
                left: 14px;
                padding: 7px 12px;
                font-size: 0.78rem;
            }
        }
        #pwa-refresh-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }
        .refresh-icon {
            font-size: 1.15rem;
            display: inline-block;
            transition: transform 0.4s ease;
        }
        .spinning {
            animation: spinRefresh 0.8s linear infinite !important;
        }
        @keyframes spinRefresh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Pull to Refresh Indicator */
        #ptr-indicator {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            z-index: 10000;
            background: rgba(15, 23, 42, 0.95);
            border: 1.5px solid #f59e0b;
            border-radius: 999px;
            padding: 7px 18px;
            color: #fbbf24;
            font-size: 0.86rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
            opacity: 0;
        }
        #ptr-indicator.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Luxury Animated Splash / Redirect Screen -->
    <div id="loading-screen">
        <div class="logo-orbit-container">
            <div class="celestial-ring"></div>
            <div class="celestial-ring-outer"></div>
            <img class="animated-logo" src="logo_icon.png" onerror="this.src='https://raw.githubusercontent.com/vyasbilawas-ctrl/vyas-astrology/master/logo_icon.png'" alt="VYAS ASTRA">
        </div>
        <div class="brand-title">VYAS ASTRA</div>
        <div class="brand-tagline">vyasastro.in &bull; Vedic Yield Astrology Systems</div>
        <div class="brand-sub">काल ज्ञान एवं ग्रह गणना का अचूक वैदिक वेध</div>
        <div class="loading-bar-wrap">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <!-- Floating Google 1-Click Sign-In on HTML wrapper -->
    <div id="google-auth-bar" style="position: fixed; top: 10px; right: 14px; z-index: 1000; display: flex; align-items: center; gap: 8px;">
        <div id="g_id_signin"></div>
    </div>

    <!-- Pull to Refresh Visual Indicator -->
    <div id="ptr-indicator">
        <span class="ptr-icon" style="display:inline-block;">🔄</span>
        <span id="ptr-text">नीचे खींचें रीफ्रेश के लिए</span>
    </div>

    <!-- PWA Floating Refresh Button (Always available on mobile/standalone) -->
    <button id="pwa-refresh-btn" onclick="refreshVyasApp()" title="ऐप रीफ्रेश करें (Refresh App)">
        <span class="refresh-icon">🔄</span>
        <span>रीफ्रेश</span>
    </button>

    <!-- PWA Install Button -->
    <button id="pwa-install-btn" title="ऐप को होम स्क्रीन पर इंस्टॉल करें">
        <span style="font-size: 1.1rem;">📲</span>
        <span>ऐप इंस्टॉल करें</span>
    </button>

    <!-- iOS Instructions Modal -->
    <div id="ios-modal">
        iPhone पर इंस्टॉल करने के लिए: नीचे शेयर (Share <b>⎋ / 📤</b>) दबाएं और <b>'Add to Home Screen'</b> चुनें।
        <div style="margin-top: 8px;">
            <button onclick="document.getElementById('ios-modal').style.display='none'" style="background:#f0c05a; color:#0b1220; border:none; padding:4px 14px; border-radius:6px; font-weight:700; cursor:pointer;">ठीक है</button>
        </div>
    </div>

    <div id="frame-container">
        <iframe 
            id="app-frame"
            src="https://vyas-astrology-111.streamlit.app/?embed=true" 
            allow="geolocation; microphone; camera; clipboard-write; clipboard-read; payment"
            onload="setTimeout(() => { document.getElementById('loading-screen').style.opacity = '0'; setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500); }, 800);"
        ></iframe>
    </div>

    <script>
        // Official Google Identity Services (GIS) & Persistent Auth Engine
        function handleGoogleCredential(response) {
            if (response && response.credential) {
                try {
                    localStorage.setItem('vyas_g_jwt', response.credential);
                    const iframe = document.getElementById('app-frame');
                    if (iframe) {
                        iframe.src = "https://vyas-astrology-111.streamlit.app/?embed=true&g_jwt=" + encodeURIComponent(response.credential);
                    }
                    const authBar = document.getElementById('google-auth-bar');
                    if (authBar) authBar.style.display = 'none';
                } catch(e) {
                    console.error("GIS Error:", e);
                }
            }
        }

        function initGoogleIdentity() {
            const savedToken = localStorage.getItem('vyas_auth_token');
            if (savedToken) {
                const authBar = document.getElementById('google-auth-bar');
                if (authBar) authBar.style.display = 'none';
            }
            if (window.google && window.google.accounts) {
                google.accounts.id.initialize({
                    client_id: "341351445313-ddlkfiqsndnvbl290bubh1u3s827c3b2.apps.googleusercontent.com",
                    callback: handleGoogleCredential,
                    auto_select: false,
                    cancel_on_tap_outside: true
                });

                // Render standard Google Sign-In button
                const gDiv = document.getElementById("g_id_signin");
                if (gDiv) {
                    google.accounts.id.renderButton(gDiv, {
                        theme: "filled_blue",
                        size: "medium",
                        shape: "pill",
                        text: "signin_with",
                        logo_alignment: "left"
                    });
                }

                // Show One-Tap prompt ONLY when user is not already logged in
                if (!savedToken) {
                    google.accounts.id.prompt();
                }
            } else {
                setTimeout(initGoogleIdentity, 300);
            }
        }

        // Listen for session token messages from the Streamlit app
        window.addEventListener('message', function(event) {
            try {
                if (event.data && typeof event.data === 'object') {
                    if (event.data.type === 'VYAS_AUTH_TOKEN' && event.data.token) {
                        localStorage.setItem('vyas_auth_token', event.data.token);
                        const authBar = document.getElementById('google-auth-bar');
                        if (authBar) authBar.style.display = 'none';
                    } else if (event.data.type === 'VYAS_LOGOUT') {
                        localStorage.removeItem('vyas_auth_token');
                        localStorage.removeItem('vyas_g_jwt');
                        const authBar = document.getElementById('google-auth-bar');
                        if (authBar) authBar.style.display = 'flex';
                    }
                }
            } catch(e) {}
        });

        // On Page Load: Restore session or forward params with persistent auto-login
        (function() {
            try {
                const search = window.location.search;
                const iframe = document.getElementById('app-frame');
                const savedToken = localStorage.getItem('vyas_auth_token');
                const savedJwt = localStorage.getItem('vyas_g_jwt');

                if (search) {
                    const extra = search.startsWith('?') ? search.substring(1) : search;
                    if (iframe && extra) {
                        let finalSrc = "https://vyas-astrology-111.streamlit.app/?embed=true&" + extra;
                        if (savedToken && !extra.includes('stok=')) {
                            finalSrc += "&stok=" + encodeURIComponent(savedToken);
                        }
                        iframe.src = finalSrc;
                        if (savedToken) {
                            const authBar = document.getElementById('google-auth-bar');
                            if (authBar) authBar.style.display = 'none';
                        }
                    }
                } else if (savedToken && iframe) {
                    // Auto-login using persistent session token (instant, no repeated login prompt)
                    iframe.src = "https://vyas-astrology-111.streamlit.app/?embed=true&stok=" + encodeURIComponent(savedToken);
                    const authBar = document.getElementById('google-auth-bar');
                    if (authBar) authBar.style.display = 'none';
                } else if (savedJwt && iframe) {
                    // Fallback to Google JWT
                    iframe.src = "https://vyas-astrology-111.streamlit.app/?embed=true&g_jwt=" + encodeURIComponent(savedJwt);
                    const authBar = document.getElementById('google-auth-bar');
                    if (authBar) authBar.style.display = 'none';
                }
            } catch(e) {}
        })();

        // Start GIS
        window.addEventListener('load', () => {
            initGoogleIdentity();
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        // Handle PWA Install Prompt
        let deferredPrompt = null;
        const installBtn = document.getElementById('pwa-install-btn');
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            } else if (isIOS) {
                document.getElementById('ios-modal').style.display = 'block';
            } else {
                alert('ऐप इंस्टॉल करने के लिए अपने ब्राउज़र के मेन्यू (तीन डॉट्स ⋮) में जाकर "Install App" या "Add to Home screen" चुनें।');
            }
        });

        // Hide button if already in standalone app mode and adjust refresh button position
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            installBtn.style.display = 'none';
            const refBtn = document.getElementById('pwa-refresh-btn');
            if (refBtn) refBtn.style.bottom = '20px';
        }
        // Refresh App Logic
        function refreshVyasApp() {
            const btn = document.getElementById('pwa-refresh-btn');
            const icon = btn ? btn.querySelector('.refresh-icon') : null;
            if (icon) icon.classList.add('spinning');
            
            const iframe = document.getElementById('app-frame');
            if (iframe) {
                try {
                    const url = new URL(iframe.src);
                    url.searchParams.set('_rb', Date.now());
                    iframe.src = url.toString();
                } catch(e) {
                    iframe.src = iframe.src;
                }
            } else {
                window.location.reload();
            }
            setTimeout(() => {
                if (icon) icon.classList.remove('spinning');
            }, 1200);
        }

        // Native Mobile Pull-to-Refresh Gesture Handler
        (function initPTR() {
            let startY = 0;
            let currentY = 0;
            let isDragging = false;
            const ptr = document.getElementById('ptr-indicator');
            const ptrText = document.getElementById('ptr-text');
            const threshold = 75;

            window.addEventListener('touchstart', (e) => {
                if (window.scrollY === 0 || document.documentElement.scrollTop === 0) {
                    startY = e.touches[0].clientY;
                    isDragging = true;
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentY = e.touches[0].clientY;
                const pullDist = currentY - startY;
                if (pullDist > 12 && pullDist < 180) {
                    if (ptr) {
                        ptr.classList.add('active');
                        ptr.style.transform = `translateX(-50%) translateY(${Math.min(pullDist * 0.45, 55)}px)`;
                        if (pullDist >= threshold) {
                            if (ptrText) ptrText.innerText = 'छोड़ें और रीफ्रेश करें...';
                        } else {
                            if (ptrText) ptrText.innerText = 'नीचे खींचें रीफ्रेश के लिए';
                        }
                    }
                }
            }, { passive: true });

            window.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                const pullDist = currentY - startY;
                if (pullDist >= threshold) {
                    if (ptrText) ptrText.innerText = 'रीफ्रेश हो रहा है...';
                    const ptrIcon = ptr ? ptr.querySelector('.ptr-icon') : null;
                    if (ptrIcon) ptrIcon.classList.add('spinning');
                    refreshVyasApp();
                }
                setTimeout(() => {
                    if (ptr) {
                        ptr.classList.remove('active');
                        ptr.style.transform = 'translateX(-50%) translateY(-80px)';
                        const ptrIcon = ptr.querySelector('.ptr-icon');
                        if (ptrIcon) ptrIcon.classList.remove('spinning');
                    }
                }, 900);
            }, { passive: true });
        })();
    </script>
</body>
</html>
