<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYAS ASTRA • Google साइन-इन</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #131f3b, #050811);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.94);
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            border-radius: 20px;
            padding: 28px 22px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        }
        .brand {
            font-size: 1.35rem;
            font-weight: 800;
            color: #facc15;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }
        .sub {
            font-size: 0.92rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 22px;
        }
        .g-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: 999px;
            padding: 13px 18px;
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #94a3b8;
            min-height: 20px;
        }
        .return-btn {
            display: none;
            margin-top: 14px;
            width: 100%;
            background: linear-gradient(135deg, #e6c775, #c59b27);
            color: #090d16;
            border: none;
            border-radius: 999px;
            padding: 12px 16px;
            font-size: 0.92rem;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">ॐ VYAS ASTRA</div>
        <div class="sub">अपने VYAS ASTRA Android ऐप में सुरक्षित रूप से लॉगिन करने के लिए Google खाता चुनें।</div>
        <button class="g-btn" id="startBtn" onclick="startGoogleLogin()">
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Google खाते से साइन-इन करें</span>
        </button>
        <div class="status" id="statusMsg">Google सेवा लोड हो रही है...</div>
        <a class="return-btn" id="returnAppBtn" href="#">ऐप में वापस जाएँ (Return to App)</a>
    </div>

    <script>
        var CLIENT_ID = "341351445313-ddlkfiqsndnvbl290bubh1u3s827c3b2.apps.googleusercontent.com";
        var tokenClient = null;

        function initClient() {
            if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: "openid email profile",
                    callback: function (resp) {
                        if (resp && resp.access_token) {
                            var deepLink = "vyasastro://oauth#access_token=" + encodeURIComponent(resp.access_token);
                            document.getElementById("statusMsg").innerText = "सत्यापन सफल! VYAS ASTRA ऐप खुल रहा है...";
                            var btn = document.getElementById("returnAppBtn");
                            btn.href = deepLink;
                            btn.style.display = "block";
                            window.location.href = deepLink;
                        } else {
                            document.getElementById("statusMsg").innerText = "लॉगिन पूरा नहीं हुआ। कृपया पुनः प्रयास करें।";
                        }
                    }
                });
                document.getElementById("statusMsg").innerText = "तैयार — ऊपर बटन दबाएं।";
                return true;
            }
            return false;
        }

        function startGoogleLogin() {
            if (!tokenClient && !initClient()) {
                document.getElementById("statusMsg").innerText = "कृपया एक सेकंड प्रतीक्षा करें...";
                return;
            }
            document.getElementById("statusMsg").innerText = "Google लॉगिन विंडो खुल रही है...";
            tokenClient.requestAccessToken({ prompt: "select_account" });
        }

        window.addEventListener("load", function () {
            var tries = 0;
            var timer = setInterval(function () {
                tries++;
                if (initClient() || tries > 20) clearInterval(timer);
            }, 300);
        });
    </script>
</body>
</html>
