name: Build VYAS Android Play Store Release (.AAB & .APK)

on:
  push:
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Mobile Assets Integrity
        run: |
          echo "Verifying mobile assets and manifests..."
          test -f mobile/src/index.html
          test -f mobile/src/css/mobile-elite.css
          test -f mobile/src/js/app-core.js
          test -f mobile/android/AndroidManifest.xml
          echo "Mobile assets successfully validated!"

      - name: Package Mobile Web Assets into Android APK Asset Directory
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp -r mobile/src/* mobile/android/app/src/main/assets/
          echo "Assets bundled for offline-first Android execution."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vyas-astra-mobile-package
          path: mobile/

