name: VYAS-Daivagya Automated Model Update & Continual Learning

on:
  schedule:
    # Run automatically on the 1st of every month at midnight UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force complete dataset rebuild from all books'
        required: false
        default: 'false'
        type: boolean

jobs:
  auto_update_dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield swisseph requests

      - name: Run Dataset Builder & Ingest New Sutras
        run: |
          python scripts/build_daivagya_sft_dataset.py

      - name: Check for Dataset Changes & Auto-Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "VYAS Daivagya AI Auto-Updater"
          if [[ -n $(git status -s data/daivagya_sft/) ]]; then
            echo "New astrological data detected! Committing updated dataset..."
            git add data/daivagya_sft/
            git commit -m "chore(ai): auto-update Vyas-Daivagya SFT dataset with latest shastric sutras and buffers"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Dataset is fully up to date. No changes needed."
          fi

